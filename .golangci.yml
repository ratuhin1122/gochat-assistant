run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - revive

linters-settings:
  govet:
    enable-all: false
  errcheck:
    check-type-assertions: true
    check-blank: false
  gosec:
    excludes:
      - G104 # audit errors not checked (errcheck handles this)
  revive:
    severity: warning
    confidence: 0.8
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: indent-error-flow
      - name: superfluous-else
      - name: unreachable-code
      - name: redefines-builtin-id

issues:
  exclude-dirs:
    - web
    - data
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
